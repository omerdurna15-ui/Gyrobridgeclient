name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP bulunamadı."
            exit 1
          fi

          rm -rf project
          mkdir project
          unzip -q "$ZIP_FILE" -d project

      - name: Find Android project
        shell: bash
        run: |
          PROJECT_DIR=$(find project -name "settings.gradle.kts" -type f -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle.kts bulunamadı."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.2"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GyroSwipeController-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
